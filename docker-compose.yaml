# Development mode

version: "3.7"

services:
  app:
    build: .
    image: public-parking_img
    volumes:
      - .:/app
    working_dir: /app
    container_name: "public-parking_ctn"
    hostname: "public-parking"
    ports:
      - 3000:3000
    entrypoint: ["yarn", "dev"]
    # entrypoint: ["sh", "-c", "sleep 2073600"] for debug